name: Microservices QA Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  product-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Test Product Service
        run: |
          cd product-service
          ./mvnw clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-service-results
          path: product-service/target/surefire-reports/

  user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Test User Service
        run: |
          cd user-service
          ./mvnw clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-results
          path: user-service/target/surefire-reports/

  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Test Order Service
        run: |
          cd order-service
          ./mvnw clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-service-results
          path: order-service/target/surefire-reports/
